[project]
name = "tunstrap"
description = "SSH tunnel manager for ephemeral environments"
authors = [{name = "Alex MKX"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "asyncssh @ git+https://github.com/AlexMKX/asyncssh.git@v2.23.0+forward-tracker.3",
    "pydantic>=2.13,<3",
    "click>=8.3,<9",
    "ruamel.yaml>=0.18,<0.19",
    "cryptography>=44,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.16,<0.17",
    "black>=24.10,<26",
    "pylint>=3.3,<4",
    "vulture>=2.13,<3",
]

[project.scripts]
tunstrap = "tunstrap.cli:main"

[project.urls]
Homepage = "https://github.com/AlexMKX/tunstrap"
Issues   = "https://github.com/AlexMKX/tunstrap/issues"

[build-system]
requires      = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "tunstrap/_version.py"

[tool.hatch.metadata]
# Required because `asyncssh` is pinned to a VCS URL (our fork carrying
# the SSHForwardTracker patch). Drop this once upstream asyncssh ships the
# feature and we revert to a PyPI version constraint.
allow-direct-references = true

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.format]
# Design documents intentionally use Python fences as illustrative, often
# output-sensitive examples; only exclude those Markdown files from formatting.
exclude = ["docs/**/*.md"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately model process failures, legacy annotations, and
# naive certificates; keep test code unchanged while retaining these rules in
# production modules.
"tests/**/*.py" = ["DTZ001", "PLW1510", "PYI034", "PYI036", "RUF012", "RUF059", "UP024", "UP035", "UP037"]
# Coverage instrumentation is deliberately fail-open: startup must continue
# even when the optional coverage bootstrap fails.
"sitecustomize.py" = ["S110"]
# Pydantic validators must raise ValueError so invalid input is reported as a
# validation error rather than escaping model validation as TypeError.
"tunstrap/schemas.py" = ["SIM102", "TRY004"]
# The nested contexts name the TCP socket before wrapping it for TLS, which is
# clearer for this security-sensitive probe than a compact combined statement.
"tunstrap/kube.py" = ["SIM117"]

[tool.mypy]
strict         = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["asyncssh", "asyncssh.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptography", "cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: requires docker (sshd containers)",
    "unit: pure-Python unit tests",
    "e2e: requires kind + tofu + kubectl (real Kubernetes cluster)",
]
# Coverage is collected explicitly per job: unit job uses `pytest --cov`,
# integration job uses `coverage run -m pytest`. The combine + gate step
# enforces --fail-under=80 on the merged data. `addopts` therefore only
# controls test selection and asyncio mode.
addopts = "-m 'not integration and not e2e'"
asyncio_mode = "auto"

[tool.coverage.run]
# parallel = true so that subprocess-coverage produced via sitecustomize.py
# writes its own .coverage.<pid>.<rand> file; `coverage combine` then
# merges unit + integration measurements before the gate is evaluated.
parallel = true
source = ["tunstrap"]
# _worker.py is omitted because `daemon.py::spawn_daemon` re-execs the
# Python interpreter via os.execve before the worker module runs, which
# bypasses the coverage atexit hook. The worker is functionally covered
# by the integration suite (the daemon would not start otherwise), but
# the measurement cannot be attributed.
omit = [
    "*/tunstrap/__main__.py",
    "*/tunstrap/_version.py",
    "*/tunstrap/_worker.py",
    "tunstrap/__main__.py",
    "tunstrap/_version.py",
    "tunstrap/_worker.py",
]

[tool.coverage.paths]
# Map editable-install and CI checkout paths to the same logical source so
# `coverage combine` sees a single set of files.
source = [
    "tunstrap",
    "*/tunstrap",
    "*/site-packages/tunstrap",
]

[tool.coverage.report]
# Mirror [tool.coverage.run].omit so the report excludes the same set of
# files regardless of which step produces the data.
omit = [
    "*/tunstrap/__main__.py",
    "*/tunstrap/_version.py",
    "*/tunstrap/_worker.py",
    "tunstrap/__main__.py",
    "tunstrap/_version.py",
    "tunstrap/_worker.py",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pylint.main]
fail-under = 9.0
py-version = "3.10"
ignore = ["_version.py"]

[tool.pylint."messages control"]
# Global disables: explicitly kept noise reducers for small-package codebase.
# - too-few-public-methods / too-many-* : pydantic models + asyncssh wrappers.
# - duplicate-code : noisy across small test files (re-checked manually).
# broad-exception-caught is NOT disabled globally; cases are annotated inline.
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100

[tool.vulture]
paths = ["tunstrap", "vulture_whitelist.py"]
min_confidence = 80
ignore_decorators = ["@pytest.fixture", "@field_validator*", "@model_validator*", "@classmethod"]
ignore_names = ["cls"]
