# One SSH node that can reach the kind API server, and nothing else.
#
# The service joins kind's own Docker bridge (`kind`, created by
# `kind create cluster`) because the control plane is only reachable from that
# network: a container on the default bridge cannot connect to it, and the
# host-side kubeconfig kind writes points at a random published host port that
# is useless from inside a container. Joining `kind` mirrors production - the
# SSH host is a machine that can reach the API server, and tunstrap forwards
# to it.
#
services:
  sshd-kube:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      - PUID=1000
      - PGID=1000
      - PUBLIC_KEY_FILE=/keys/id_test.pub
      - USER_NAME=tester
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
    volumes:
      # Generated by tests/e2e/conftest.py. NOT shared with tests/integration.
      - ./_keys:/keys:ro
      # MANDATORY. Without this mount the image never emits its
      # `Include /config/sshd/sshd_config.d/*.conf` line, the shipped
      # `AllowTcpForwarding no` stands, and every forwarded connection is
      # refused with `administratively prohibited` - while `tunstrap start`
      # still reports success.
      - ./_sshd_conf:/config/sshd/sshd_config.d:ro
      # The control plane's in-node kubeconfig, written by the fixture.
      - ./_kube:/etc/kube:ro
    ports:
      - "127.0.0.1::2222"
    networks:
      - kind

networks:
  kind:
    external: true
    name: kind
